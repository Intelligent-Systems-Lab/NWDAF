info:
  version: 1.0.0
  description: NWDAF initial configuration

configuration:
  mongodb:
    name: free5gc
    url: mongodb://127.0.0.1:27017
  nwdafName: NWDAF
  sbi:
    scheme: http         # current runtime supports HTTP only
    registerIPv4: 127.0.0.1
    bindingIPv4: 127.0.0.1
    port: 8080
  supportedAnalytics:
    - UE_COMMUNICATION
  # nrfUri: http://127.0.0.10:8000  # Reserved config; NRF registration is not wired yet

  # SMF Data Collection
  smf:
    enabled: true
    endpoints:
      - http://127.0.0.1:8081  # Fake SMF+UPF server for testing
    subscriptionDuration: 3600  # seconds
    notifUris:
      smf: http://127.0.0.1:8080/collector/notify
      upf: http://127.0.0.1:8080/collector/upf-notify

  # Analytics model parameters per event type
  analytics:
    ueCommunication:
      samplingInterval: 30  # UPF report period (seconds); governs smf repPeriod
      inputWindow: 30       # data points fed to ML model (30 × 30s = 15 min history)
      outputWindow: 1       # ML service predicts 1 step ahead
      lookbackBuffer: 15    # extra seconds added to query window to absorb jitter (default: 2×samplingInterval)
      # queryLookback = samplingInterval × inputWindow + lookbackBuffer (auto-computed)
      ringBufferSize: 50    # in-memory ring buffer size per UE session; must be >= inputWindow

  # External MTLF Integration
  externalMtlf:
    enabled: false  # Disable MTLF to use static model URL
    endpoints:
      - http://127.0.0.1:8082  # Fake MTLF server for testing
    notifUri: http://127.0.0.1:8080/mlmodel-notify

  # ML Inference Service
  mlService:
    enabled: true
    endpoint: http://127.0.0.1:9090  # ML inference service

  # Group ID to SUPI mapping (substitute for UDM per TS 23.502 §4.15.4.5.2)
  groupMembership:
    groups:
      - groupId: "group-test-001"
        supis:
          - "imsi-123456789012345"
          - "imsi-123456789012346"
          - "imsi-123456789012347"
      - groupId: "group-test-002"
        supis:
          - "imsi-123456789012348"
          - "imsi-123456789012349"
          - "imsi-123456789012350"

  # MTLF (Daisy FL Framework)
  mtlf:
    enabled: true               # Master switch for all Daisy FL features
    endpoint: http://127.0.0.1:9887
    triggerOnStartup: false      # Trigger training once after NWDAF startup
    triggerDelay: 10            # seconds to wait before startup trigger
    staticModelUrl: http://placeholder/download/initial  # Initial model bundle (pre-cached in ML Service artifacts/initial/)
    accuracyMonitor:
      enabled: true            # Trigger retraining on accuracy degradation
      checkInterval: 90         # seconds between accuracy checks
      minSamples: 2             # keep testbed margin; do not require the theoretical max slots per round
      warmupDuration: 20        # seconds to skip checks after start (model cold-start)
      metricsToRecord:
        - sMAPE
        - MAE
        - MSE
        - WAPE
        - NRMSE
      primaryMetric: WAPE       # decision metric for retrain policy
      recentBufferSize: 12      # per-scope retained report history
      minBufferSamples: 5       # samples required before enabling z-score gate
      minStd: 0.14              # floor on std to avoid unstable z-scores
      fixedFloor: 0.05          # degradation eligibility floor in primary metric space
      zScoreThreshold: 1.3      # relative anomaly threshold
      decisionWindowSize: 5     # evaluate the latest M decision rounds
      requiredHitsInWindow: 3   # require N hits inside the latest M rounds
      scopeStateTTL: 600        # seconds before inactive scope state is GC'd
      consecutiveBreaches: 3    # required consecutive triggered rounds
      degradationPolicy:
        minDecisionTrafficScale: 1024
      chronicPolicy:
        enabled: false          # disable chronic path on the current transition-only testbed line
        metric: WAPE            # first implementation supports WAPE/NRMSE/MAE
        aggregator: percentile  # mean | percentile
        percentile: 75          # use 50 to represent median
        threshold: 0.97         # chronic metric threshold used in recent replay experiments
        minDecisionTrafficScale: 1024   # minimum traffic scale before chronic path is considered
      lowTrafficOverpredictionPolicy:
        enabled: false
        maxActualTrafficScale: 1024
        minPredictedTrafficScale: 4096
        predictionOvershootRatio: 4.0
    task:
      TID: "nwdaf_fl_training"
      NUM_ROUNDS: 30
      ES_PATIENCE: 2    # early stopping: halt after N rounds without val loss improvement
      LR_PATIENCE: 2    # reduce LR by 0.5x after N rounds without improvement
      INITIAL_LR: 0.001
      EVALUATE_INTERVAL: 1
      EVALUATE_INIT_MODEL_MASTER: true
      MIN_WAITING_TIME_MASTER: 5
      MODEL_PATH: "model/model.npy"
      OPERATORS:
        MASTER_SERVER_OPERATOR: ["daisyfl.operator.base.base_server_logic", "BaseServerLogic"]
        CLIENT_OPERATOR: ["daisyfl.operator.base.base_client_logic", "BaseClientLogic"]
      STRATEGIES:
        MASTER_STRATEGY: ["custom_strategy", "EarlyStoppingFedAvg"]
      METRICS_HANDLERS:
        MASTER_METRICS_HANDLER: ["daisyfl.metrics_handler.flat_metrics_handler", "FlatMetricsHandler"]
      SAVE_MODEL: true
      MODEL_META:
        model:
          input_size: 10
          output_size: 2
          num_channels: [32, 64, 64, 64]
          kernel_size: 2
          dropout: 0.2
        inference:
          seq_length: 30
          out_seq_len: 1
          feature_order:
            - total_vol
            - ul_vol
            - dl_vol
            - total_nb_pkts
            - ul_nb_pkts
            - dl_nb_pkts
            - ul_thr
            - dl_thr
            - ul_pkt_thr
            - dl_pkt_thr
          output_fields:
            - ul_vol
            - dl_vol
          preprocessing: log1p_standard_scaler
        training:
          local_epochs: 3

  # ADRF (Analytics Data Repository Function) — TS 29.575
  adrf:
    url: http://127.0.0.1:9888
    storageThreshold: 1   # per-UE: flush every N notifications from the same UE; 1 = immediate
    fetchBatchSize: 1     # IDs per RetrievalRequest GET; ADRF V0 enforces exactly 1 — do not change
    retrainWindow: 1200   # seconds of history to fetch for retrain
    watchdogTimeout: 120  # seconds after last callback before watchdog fires

logger:
  enable: true
  level: info
  reportCaller: false
