info:
  version: 1.0.0
  description: NWDAF initial configuration

configuration:
  nwdafName: NWDAF
  sbi:
    scheme: http         # protocol for sbi (http or https)
    registerIPv4: 127.0.0.1
    bindingIPv4: 127.0.0.1
    port: 8080
    tls:
      pem: cert/nwdaf.pem
      key: cert/nwdaf.key
  supportedAnalytics:
    - UE_COMMUNICATION
  nrfUri: http://127.0.0.10:8000  # NRF API root
  nrfCertPem: cert/nrf.pem        # NRF public certificate used to verify OAuth access tokens

  anlf:
    server:
      bindingIPv4: 127.0.0.1
      registerIPv4: 127.0.0.1
      port: 8090

  # External MTLF Integration
  externalMtlf:
    enabled: false  # Disable MTLF to use static model URL
    endpoints:
      - http://127.0.0.1:8082  # Fake MTLF server for testing

  # AnLF Backend
  anlfBackend:
    enabled: true
    endpoint: http://127.0.0.1:9093  # Local AnLF backend
    requestTimeout: 5

  # Private MTLF backend connection. Standard SBI remains owned by NWDAF Go.
  mtlfBackend:
    enabled: true
    endpoint: http://127.0.0.1:9092
    requestTimeout: 5

  # ADRF (Analytics Data Repository Function) — TS 29.575
  adrf:
    url: http://127.0.0.1:9888
    storageThreshold: 1   # per-UE: flush every N notifications from the same UE; 1 = immediate
    fetchBatchSize: 1     # IDs per RetrievalRequest GET; ADRF V0 enforces exactly 1 — do not change
    retrainWindow: 1200   # seconds of history to fetch for retrain
    watchdogTimeout: 120  # seconds after last callback before watchdog fires

logger:
  enable: true
  level: info
  reportCaller: false
