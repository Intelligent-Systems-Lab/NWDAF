info:
  version: 1.0.0
  description: NWDAF initial configuration

configuration:
  mongodb:
    name: free5gc
    url: mongodb://127.0.0.1:27017
  nwdafName: NWDAF
  sbi:
    scheme: http
    registerIPv4: 127.0.0.1
    bindingIPv4: 127.0.0.1
    port: 8080
  # nrfUri: http://127.0.0.10:8000  # Uncomment when NRF is available

  # SMF Data Collection
  smf:
    enabled: true
    endpoints:
      - http://127.0.0.1:8081  # Fake SMF+UPF server for testing
    subscriptionDuration: 3600  # seconds
    notifUris:
      smf: http://127.0.0.1:8080/collector/notify
      upf: http://127.0.0.1:8080/collector/upf-notify

  # Analytics model parameters per event type
  analytics:
    ueCommunication:
      samplingInterval: 5   # UPF report period (seconds); governs smf repPeriod
      inputWindow: 30       # data points fed to ML model (30 × 5s = 2.5 min history)
      outputWindow: 1       # ML service predicts 1 step ahead
      # queryLookback = samplingInterval × inputWindow = 150s (auto-computed)

  # External MTLF Integration
  externalMtlf:
    enabled: false  # Disable MTLF to use static model URL
    endpoints:
      - http://127.0.0.1:8082  # Fake MTLF server for testing
    notifUri: http://127.0.0.1:8080/mlmodel-notify

  # ML Inference Service
  mlService:
    enabled: true
    endpoint: http://127.0.0.1:9090  # ML inference service

  # Group ID to SUPI mapping (substitute for UDM per TS 23.502 §4.15.4.5.2)
  groupMembership:
    groups:
      - groupId: "group-test-001"
        supis:
          - "imsi-123456789012345"
          - "imsi-123456789012346"
          - "imsi-123456789012347"
      - groupId: "group-test-002"
        supis:
          - "imsi-123456789012348"
          - "imsi-123456789012349"
          - "imsi-123456789012350"

  # MTLF (Daisy FL Framework)
  mtlf:
    enabled: true               # Master switch for all Daisy FL features
    endpoint: http://127.0.0.1:9887
    triggerOnStartup: false      # Trigger training once after NWDAF startup
    triggerDelay: 10            # seconds to wait before startup trigger
    staticModelUrl: nwdaf_ml_service/ml/artifacts/model_original.npy  # Static path for direct model loading
    accuracyMonitor:
      enabled: true            # Trigger retraining on accuracy degradation
      checkInterval: 50         # seconds between accuracy checks
      deviationThreshold: 0.3   # sMAPE [0,2] > 0.3 triggers retraining
      minSamples: 5             # min ground truth samples before evaluation
      warmupDuration: 155       # seconds to skip checks after start (model cold-start)
      triggerStrategy: consecutive  # "consecutive" or "ema"
      consecutiveBreaches: 3    # required consecutive checks (for consecutive)
      emaAlpha: 0.3             # EMA smoothing factor 0-1 (for ema)
    task:
      TID: "nwdaf_fl_training"
      NUM_ROUNDS: 2
      EVALUATE_INTERVAL: 1
      EVALUATE_INIT_MODEL_MASTER: true
      MIN_WAITING_TIME_MASTER: 5
      MODEL_PATH: "nwdaf_ml_service/ml/artifacts/model_new.npy"
      OPERATORS:
        MASTER_SERVER_OPERATOR: ["daisyfl.operator.base.base_server_logic", "BaseServerLogic"]
        CLIENT_OPERATOR: ["daisyfl.operator.base.base_client_logic", "BaseClientLogic"]
      STRATEGIES:
        MASTER_STRATEGY: ["daisyfl.strategy.fedavg", "FedAvg"]
      METRICS_HANDLERS:
        MASTER_METRICS_HANDLER: ["daisyfl.metrics_handler.flat_metrics_handler", "FlatMetricsHandler"]
      SAVE_MODEL: true

logger:
  enable: true
  level: info
  reportCaller: false
